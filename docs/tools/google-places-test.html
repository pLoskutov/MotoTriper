latitude}, ${loc.longitude}\n→ ${p.id||''}`)}}catch(e){result.push(`${i+1}. ${name}\nERROR: ${e}`)}last=result.join('\n\n');out.textContent=last}});document.getElementById('copy').addEventListener('click',async()=>{const text=last||document.getElementById('out').textContent;if(!text||text==='Результат появится здесь.')return;let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true}}catch(e){}if(!ok)ok=fallbackCopy(text);const b=document.getElementById('copy');const old=b.textContent;b.textContent=ok?'Скопировано ✓':'Не удалось скопировать';setTimeout(()=>b.textContent=old,1500)});</script></body></html>
